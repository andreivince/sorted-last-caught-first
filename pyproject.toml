[project]
name = "breadcrumbs"
version = "0.1.0"
description = "Forensics of an AI agent swarm and its human moderator on DSE wiki"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
